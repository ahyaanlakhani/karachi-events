name: Update and publish radar

on:
  push:
    branches: [main]
    paths: ['docs/**', 'agent/**', 'tests/**', 'requirements.txt', '.github/workflows/radar.yml']
  schedule:
    # 07:17 Pakistan Standard Time. GitHub may delay scheduled jobs.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Collect fresh events before publishing
        type: boolean
        default: true

concurrency:
  group: karachi-events-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test the agent
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: .cache/extractions
          key: radar-extractions-v1-${{ github.run_id }}
          restore-keys: radar-extractions-v1-
      - name: Collect and verify events
        id: collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: python -m agent.radar
      - name: Save data and credit accounting
        if: steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/events.json docs/status.json
          if [ -f .state/usage.json ]; then git add .state/usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update event radar data and status'
            git push origin HEAD:main
          fi
      - name: Stage only public dashboard files
        run: |
          mkdir public-site
          cp docs/index.html docs/styles.css docs/app.js docs/events.json docs/status.json public-site/
          touch public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [prepare, deploy]
    if: always() && needs.prepare.outputs.collection_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Flag a failed collection after publishing its status
        run: |
          echo 'Collection failed. Previous event data was preserved. Check docs/status.json and the Collect step.'
          exit 1
